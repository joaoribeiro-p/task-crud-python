<div id="delete-modal" class="modal-overlay">
    <div class="modal">
        <h2>Tem certeza que deseja deletar esta tarefa?</h2>

        <div class="modal-actions">
            <button type="button" class="delete-btn" onclick="confirmDelete()">
                Deletar

            <button type="button" class="secondary-button" onclick="closeDeleteModal()">
                Cancelar
            </button>
        </div>
    </div>
</div>
